<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body { margin:0; padding:32px 44px; background:#e9e6df; font-family:"Microsoft YaHei",sans-serif; }
  h1 { font-size:19px; color:#2b2b2b; margin:0 0 4px; }
  .sub { font-size:13px; color:#777; margin-bottom:26px; }
  .grid { display:grid; grid-template-columns:repeat(3, 300px); gap:26px; }
  .tile { background:#fff; border-radius:10px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .tilebox { width:270px; height:270px; border-radius:24%; background:#F7F3EA;
             display:flex; align-items:center; justify-content:center; }
  .tilebox svg { width:250px; height:250px; }
  .name { font-size:14px; font-weight:bold; color:#30343A; margin:10px 0 3px; }
  .desc { font-size:11.5px; color:#6f6a5e; line-height:1.55; }
</style>
</head>
<body>
<h1>扫描页 6 — 繘瓶极简 · 二至三元素</h1>
<div class="sub">《易·井卦》：汲之 minimal = 繘（绳）+ 瓶。井不画，纸面即井。报编号+直觉词。</div>
<div class="grid" id="g"></div>
<script>
const PAPER="#F7F3EA", INK="#30343A", ZHU="#9E2F26";

// K1 悬汲：一根垂绳 + 朱瓶（瓶身+瓶颈两段），纸面为井
const K1 = `
  <line x1="54" y1="27" x2="54" y2="54" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
  <rect x="51" y="53" width="6" height="8" rx="2" fill="${ZHU}"/>
  <rect x="46" y="59" width="16" height="15" rx="4" fill="${ZHU}"/>`;

// K2 瓶出于波：朱瓶微倾 + 一道墨波——刚汲离水面的一帧
const K2 = `
  <g transform="rotate(-6 54 48)">
    <rect x="51" y="33" width="6" height="9" rx="2" fill="${ZHU}"/>
    <rect x="45" y="40" width="18" height="17" rx="4.5" fill="${ZHU}"/>
  </g>
  <line x1="37" y1="76" x2="71" y2="76" stroke="${INK}" stroke-width="3.6" stroke-linecap="round"/>`;

// K3 绠绕方井：方井口 + 斜绳 + 朱瓶——井口留下，水省去
const K3 = `
  <rect x="28" y="28" width="52" height="52" rx="5" fill="none" stroke="${INK}" stroke-width="7"/>
  <line x1="70" y1="28" x2="52" y2="49" stroke="${INK}" stroke-width="2.8"/>
  <rect x="49.5" y="48" width="5" height="7" rx="1.5" fill="${ZHU}"/>
  <rect x="45" y="53.5" width="14" height="13" rx="3.5" fill="${ZHU}"/>`;

const cs = [
  ["K1","悬汲","一根绳吊一瓶：井不画，纸面就是井。两元素，名字的最小叙事——今天汲上来一首。"],
  ["K2","瓶出于波","一只朱瓶微倾+一道墨波：刚汲离水面的那一帧。瓶是唯一朱色主体。"],
  ["K3","绠绕方井","方井口+斜绳+朱瓶：H2 去水去繁——井口保留坐标感，故事靠绳瓶。"],
];
document.getElementById("g").innerHTML = cs.map(v =>
  `<div class="tile"><div class="tilebox"><svg viewBox="0 0 108 108">${
    {K1,K2,K3}[v[0]]}</svg></div>
   <div class="name">${v[0]} · ${v[1]}</div><div class="desc">${v[2]}</div></div>`).join("");
</script>
</body>
</html>
