<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body { margin:0; padding:32px 44px; background:#e9e6df; font-family:"Microsoft YaHei",sans-serif; }
  h1 { font-size:19px; color:#2b2b2b; margin:0 0 4px; }
  .sub { font-size:13px; color:#777; margin-bottom:26px; }
  .grid { display:grid; grid-template-columns:repeat(3, 300px); gap:26px; }
  .tile { background:#fff; border-radius:10px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .tilebox { width:270px; height:270px; border-radius:24%; background:#F7F3EA;
             display:flex; align-items:center; justify-content:center; }
  .tilebox svg { width:250px; height:250px; }
  .name { font-size:14px; font-weight:bold; color:#30343A; margin:10px 0 3px; }
  .desc { font-size:11.5px; color:#6f6a5e; line-height:1.55; }
</style>
</head>
<body>
<h1>扫描页 2 — 拼装 mark 五候选</h1>
<div class="sub">语言约束来自扫描页 1 的提取：拼装·填充·紧凑·产品色族（纸 F7F3EA / 墨 30343A / 朱 9E2F26 / 黛 3F5B72 / 赭 B07D3F）。报编号+直觉词。</div>
<div class="grid" id="g"></div>
<script>
const PAPER="#F7F3EA", INK="#30343A", ZHU="#9E2F26", DAI="#3F5B72", ZHE="#B07D3F";

// C1 柿蒂纹：四瓣绕心，各色一瓣
function petal(color, rot) {
  return `<path d="M54,52 C45,44 45,32 54,27 C63,32 63,44 54,52 Z" fill="${color}"
    transform="rotate(${rot} 54 54)"/>`;
}
const C1 = petal(ZHU,-90) + petal(DAI,0) + petal(INK,90) + petal(ZHE,180);

// C2 榫卯：竖枋黛横枋朱，十字搭接（横枋分两段让位）
const C2 = `<rect x="44" y="26" width="20" height="56" rx="4" fill="${DAI}"/>
  <rect x="26" y="44" width="22" height="20" rx="4" fill="${ZHU}"/>
  <rect x="60" y="44" width="22" height="20" rx="4" fill="${ZHU}"/>`;

// C3 非字之印：朱印面，白文三行+落款点（无任何真字）
const C3 = `<rect x="22" y="22" width="64" height="64" rx="7" fill="${ZHU}"/>
  <rect x="32" y="34" width="34" height="7" rx="3.5" fill="${PAPER}"/>
  <rect x="32" y="47" width="26" height="7" rx="3.5" fill="${PAPER}"/>
  <rect x="32" y="60" width="16" height="7" rx="3.5" fill="${PAPER}"/>
  <rect x="68" y="60" width="8" height="8" rx="2" fill="${PAPER}"/>`;

// C4 圆容器拼装：墨底圆，三瓣风车拼装
function cpetal(color, rot) {
  return `<path d="M54,54 C50,44 50,34 54,29 C58,34 58,44 54,54 Z" fill="${color}"
    transform="rotate(${rot} 54 54)"/>`;
}
const C4 = `<circle cx="54" cy="54" r="31" fill="${INK}"/>`
  + cpetal(ZHU,-90) + cpetal(ZHE,30) + cpetal(DAI,150);

// C5 三签条：黛赭插册，朱签最短=今日抽出
const C5 = `<rect x="31" y="28" width="13" height="48" rx="6.5" fill="${DAI}"/>
  <rect x="47.5" y="36" width="13" height="40" rx="6.5" fill="${ZHE}"/>
  <rect x="64" y="46" width="13" height="30" rx="6.5" fill="${ZHU}"/>`;

const cs = [
  ["C1","柿蒂纹四瓣","汉器纹样入 mark：四瓣绕心，一瓣一色（朱/黛/墨/赭）。结构同 Craft 但母题是自己的。"],
  ["C2","榫卯十字","竖枋横枋搭接，咬合处留白让位——拼装 mark 的主题就是拼装本身，理性最重。"],
  ["C3","非字之印","朱印面+白文三行+落款点：印章气质（呼应你选的搜韵）但无一真字。"],
  ["C4","圆容器拼装","墨圆只做容器（WPS 逻辑），内里三瓣风车（朱/赭/黛）。存在感最强。"],
  ["C5","三签条","书里三枚纸签：黛赭插册，朱签最短是今日抽出的一枚——叙事指向一天一首。"],
];
document.getElementById("g").innerHTML = cs.map(v =>
  `<div class="tile"><div class="tilebox"><svg viewBox="0 0 108 108">${
    {C1,C2,C3,C4,C5}[v[0]]}</svg></div>
   <div class="name">${v[0]} · ${v[1]}</div><div class="desc">${v[2]}</div></div>`).join("");
</script>
</body>
</html>
